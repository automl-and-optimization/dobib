abstract: Understanding model predictions is essential for physical applications,
  where outputs often inform safety-critical decisions, such as structural load assessment,
  weather warnings, and clinical diagnosis. Shapley values satisfy many desirable
  properties as an attribution method, but their computational cost during inference
  hinders their practical use. Current amortized explainers, such as FastSHAP, are
  limited to homogeneous inputs, which is problematic for physical applications where
  data often comes from irregular grids and geometries. We introduce OperatorSHAP,
  a grid-agnostic attribution method and training procedure that allows us to train
  FastSHAP-like explainers for neural operators. We establish a theoretical framework
  for attributions in function space, connecting to Aumann-Shapley values. We further
  show that OperatorSHAP's explanations are consistent with state-of-the-art discrete
  Shapley values across resolutions and transfer across grid sizes without retraining.
