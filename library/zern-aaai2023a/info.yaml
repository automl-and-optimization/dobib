abstract: <jats:p>In recent years, game-theoretic Shapley values have gained increasing
  attention with respect to local model explanation by feature attributions. While
  the approach using Shapley values is model-independent, their (exact) computation
  is usually intractable, so efficient model-specific algorithms have been devised
  including approaches for decision trees or their ensembles in general. Our work
  goes further in this direction by extending the interventional TreeSHAP algorithm
  to piecewise linear regression trees, which gained more attention in the past few
  years. To this end, we introduce a decomposition of the contribution function based
  on decision paths, which allows a more comprehensible formulation of SHAP algorithms
  for tree-based models. Our algorithm can also be readily applied to computing SHAP
  interaction values of these models. In particular, as the main contribution of this
  paper, we provide a more efficient approach of interventional SHAP for tree-based
  models by precomputing statistics of the background data based on the tree structure.</jats:p>
