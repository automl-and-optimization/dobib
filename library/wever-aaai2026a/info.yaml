abstract: "<jats:p>Hyperparameter optimization (HPO) is a crucial step in achieving
  strong predictive performance.\nYet, the impact of individual hyperparameters on
  model generalization is highly context-dependent, prohibiting a one-size-fits-all
  solution and requiring opaque HPO methods to find optimal configurations.\nHowever,
  the black-box nature of most HPO methods undermines user trust and discourages adoption.
  \nTo address this, we propose a game-theoretic explainability framework for HPO
  based on Shapley values and interactions.\nOur approach provides an additive decomposition
  of a performance measure across hyperparameters, enabling local and global explanations
  of hyperparameters' contributions and their interactions. \nThe framework, named
  HyperSHAP, offers insights into ablation studies, the tunability of learning algorithms,
  and optimizer behavior across different hyperparameter spaces.\nWe demonstrate HyperSHAP's
  capabilities on various HPO benchmarks to analyze the interaction structure of the
  corresponding HPO problems, demonstrating its broad applicability and actionable
  insights for improving HPO.</jats:p>"
